name: Publish to npm

# Publishes with npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com → risal-mcp-server → Settings → Trusted Publisher:
#   provider GitHub Actions · org/user "ziyarago" · repo "risal-mcp-server" · workflow "publish.yml"
# Then publish by pushing a version tag (git tag v1.14.0 && git push origin v1.14.0)
# or by running this workflow manually from the Actions tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships an older npm).
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # No package-lock.json in the repo, so npm ci is not available.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
